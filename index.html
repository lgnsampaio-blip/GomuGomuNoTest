<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gomu Gomu Test</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #0b071a; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; font-size: 16px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; touch-action: none; border: 2px solid rgba(255,255,255,0.4); }
        #joystick-knob { width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #btn-jump { position: absolute; bottom: 40px; right: 30px; width: 70px; height: 70px; background: rgba(148, 0, 211, 0.6); border: 2px solid #9400d3; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 0 10px rgba(0,0,0,0.5); touch-action: none; }
        #btn-jump:active { background: rgba(148, 0, 211, 0.9); transform: scale(0.95); }
        #tip { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; pointer-events: none; width: 80%; text-shadow: 1px 1px 2px #000; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>

    <div id="ui">
        <div style="font-size: 18px; font-weight: bold;">🏴‍☠️ Gomu Gomu Mobile</div>
        <div>Frutas: <span id="score" style="color: #bc3fff; font-weight: bold;">0</span></div>
    </div>

    <div id="tip">Toque na tela para esticar o braço!</div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    <div id="btn-jump">PULO</div>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer;
        let luffy, fruta, socoBraco;
        let score = 0;

        let moveInput = { x: 0, y: 0 };
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.38;
        let isJumping = false;

        let isPunching = false;
        let punchProgress = 0;
        const punchSpeed = 0.08;
        let punchTarget = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0c20);
            scene.fog = new THREE.FogExp2(0x0f0c20, 0.03);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(10, 25, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const ground = new THREE.Mesh(
                new THREE.CylinderGeometry(22, 22, 1, 32),
                new THREE.MeshStandardMaterial({ color: 0x1b4d3e, roughness: 0.9 })
            );
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            for(let i = 0; i < 4; i++) {
                const h = Math.random() * 3 + 2;
                const pilar = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.8, 1.8, h, 16),
                    new THREE.MeshStandardMaterial({ color: 0x3a3a4a })
                );
                pilar.position.set((Math.random() - 0.5) * 18, h/2, (Math.random() - 0.5) * 18);
                pilar.castShadow = true;
                pilar.receiveShadow = true;
                scene.add(pilar);
            }

            luffy = new THREE.Group();
            const corpo = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xcc0000 }));
            corpo.castShadow = true;
            luffy.add(corpo);

            const shorts = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.4, 1.22), new THREE.MeshStandardMaterial({ color: 0x0044cc }));
            shorts.position.y = -0.5;
            luffy.add(shorts);

            const chapeu = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 0.25, 16), new THREE.MeshStandardMaterial({ color: 0xdcb265 }));
            chapeu.position.y = 0.75;
            chapeu.castShadow = true;
            luffy.add(chapeu);

            luffy.position.set(0, 0.6, 0);
            scene.add(luffy);

            socoBraco = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.15, 1, 8),
                new THREE.MeshStandardMaterial({ color: 0xffdbac })
            );
            socoBraco.visible = false;
            scene.add(socoBraco);

            spawnFruta();
            setupMobileControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function spawnFruta() {
            if (fruta) scene.remove(fruta);
            fruta = new THREE.Group();
            const base = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), new THREE.MeshStandardMaterial({ color: 0x7b1fa2, roughness: 0.2 }));
            base.castShadow = true;
            fruta.add(base);

            const topo = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.08, 4, 12, Math.PI * 1.6), new THREE.MeshStandardMaterial({ color: 0x4caf50 }));
            topo.position.y = 0.8;
            topo.rotation.x = Math.PI / 2;
            fruta.add(topo);

            fruta.position.set((Math.random() - 0.5) * 26, 0.8, (Math.random() - 0.5) * 26);
            scene.add(fruta);
        }

        function setupMobileControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            const btnJump = document.getElementById('btn-jump');

            let joystickActive = false;
            let startX = 0, startY = 0;
            const maxRadius = 40;

            container.addEventListener('touchstart', (e) => {
                joystickActive = true;
                const rect = container.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                e.stopPropagation();
            });

            window.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                
                let touch = e.touches[0];
                for(let t of e.touches) {
                    if(t.clientX < window.innerWidth / 2) { touch = t; break; }
                }

                let deltaX = touch.clientX - startX;
                let deltaY = touch.clientY - startY;
                let dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);

                if (dist > maxRadius) {
                    deltaX = (deltaX / dist) * maxRadius;
                    deltaY = (deltaY / dist) * maxRadius;
                    dist = maxRadius;
                }

                knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                moveInput.x = deltaX / maxRadius;
                moveInput.y = deltaY / maxRadius;
            });

            const endJoystick = () => {
                joystickActive = false;
                knob.style.transform = `translate(0px, 0px)`;
                moveInput.x = 0;
                moveInput.y = 0;
            };

            window.addEventListener('touchend', (e) => {
                let leftTouchActive = false;
                for(let t of e.touches) {
                    if(t.clientX < window.innerWidth / 2) leftTouchActive = true;
                }
                if(!leftTouchActive) endJoystick();
            });

            btnJump.addEventListener('touchstart', (e) => {
                if (!isJumping) {
                    velocityY = jumpStrength;
                    isJumping = true;
                    luffy.scale.set(1.3, 0.7, 1.3);
                }
                e.stopPropagation();
                e.preventDefault();
            });

            window.addEventListener('touchstart', (e) => {
                if (e.target.id === 'btn-jump' || e.target.id === 'joystick-container' || e.target.id === 'joystick-knob') return;

                if (!isPunching) {
                    isPunching = true;
                    punchProgress = 0;
                    punchTarget.copy(fruta.position);
                    socoBraco.visible = true;
                }
            });
        }

        function updateFisicaEMovimento() {
            const speed = 0.14;
            const moveX = moveInput.x * speed;
            const moveZ = moveInput.y * speed;

            luffy.position.x += moveX;
            luffy.position.z += moveZ;

            if (Math.abs(moveInput.x) > 0.1 || Math.abs(moveInput.y) > 0.1) {
                luffy.rotation.y = Math.atan2(moveX, moveZ);
            }

            if (isJumping) {
                velocityY += gravity;
                luffy.position.y += velocityY;
                luffy.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);

                if (luffy.position.y <= 0.6) {
luffy.position.y = 0.6;
isJumping = false;
velocityY = 0;
luffy.scale.set(1.2, 0.8, 1.2);
}
} else {
luffy.scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
}
const dist = Math.sqrt(luffy.position.x2 + luffy.position.z2);
if (dist > 21) {
luffy.position.setLength(21);
luffy.position.y = isJumping ? luffy.position.y : 0.6;
}
}
function updateGomuGomuPistol() {
if (!isPunching) return;
punchProgress += punchSpeed;
const origen = luffy.position.clone().add(new THREE.Vector3(0, 0.2, 0));
const bracoAtual = new THREE.Vector3();
if (punchProgress <= Math.PI) {
const fator = Math.sin(punchProgress / 2);
bracoAtual.lerpVectors(origen, punchTarget, fator);
} else {
const fator = Math.sin(punchProgress / 2);
bracoAtual.lerpVectors(punchTarget, origen, 1 - fator);
if(fruta.position.distanceTo(punchTarget) < 2.0) {
fruta.position.lerp(origen, 0.18);
}
}
const distance = origen.distanceTo(bracoAtual);
socoBraco.position.copy(origen).add(bracoAtual).multiplyScalar(0.5);
socoBraco.lookAt(bracoAtual);
socoBraco.rotation.x += Math.PI / 2;
socoBraco.scale.set(1, distance, 1);
if (punchProgress >= Math.PI * 2) {
isPunching = false;
socoBraco.visible = false;
}
}
function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
function animate() {
requestAnimationFrame(animate);
updateFisicaEMovimento();
updateGomuGomuPistol();
fruta.rotation.y += 0.02;
if(!isPunching) {
fruta.position.y = 0.8 + Math.sin(Date.now() * 0.004) * 0.18;
}
const cameraAlvo = new THREE.Vector3(luffy.position.x, luffy.position.y + 7, luffy.position.z + 13);
camera.position.lerp(cameraAlvo, 0.08);
camera.lookAt(luffy.position.x, luffy.position.y + 1, luffy.position.z);
if (luffy.position.distanceTo(fruta.position) < 1.6) {
score++;
document.getElementById('score').innerText = score;
spawnFruta();
}
renderer.render(scene, camera);
}
window.onload = init;
